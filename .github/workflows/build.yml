name: Static Analysis

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-and-package:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.14'

    - name: Install Python Dependencies
      run: pip install ruff pylint setuptools -e .

    - name: Run Ruff Static Analysis
      run: ruff check src/uninews/

    - name: Run Pylint
      run: pylint src/uninews/
