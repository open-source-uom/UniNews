[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "uninews"
version = "0.2.1"
description = "University news from Greek and international universities in one place"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "PyQt6>=6.5",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "feedparser>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.gui-scripts]
uninews = "uninews.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uninews = ["resources/publishers/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
